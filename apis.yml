name: Collaborative Robotics
description: >-
  Collaborative Robotics (Cobot) is a Physical AI company founded by Brad Porter
  building AI-powered collaborative robots that work safely alongside people. Its
  flagship robot, Proxie, is a human-capable mobile manipulator designed to address
  labor shortages across warehousing, manufacturing, logistics, and healthcare. The
  company uses ScoutMap to analyze facility operations and identify automation
  opportunities, then deploys robots that learn real-world workflow patterns. Backed
  by General Catalyst, Collaborative Robotics is added to the API Evangelist network
  as a company profile; it is a hardware / Physical AI provider with no public
  developer API surface at this time.
